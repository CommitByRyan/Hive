[workspace]
resolver = "2"
members = [
    "crates/hive-types",
    "crates/hive-config",
    "crates/hive-cli",
    "crates/hive-store",
    "crates/hive-events",
    "crates/hive-policy",
    "crates/hive-tools",
    "crates/hive-llm",
    "crates/hive-agent",
    "crates/hive-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }

