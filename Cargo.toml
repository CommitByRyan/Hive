[workspace]
resolver = "2"
members = [
    "crates/hive-types",
    "crates/hive-config",
    "crates/hive-cli",
    "crates/hive-store",
    "crates/hive-events",
    "crates/hive-policy",
    "crates/hive-platform",
    "crates/hive-tools",
    "crates/hive-llm",
    "crates/hive-agent",
    "crates/hive-runtime",
    "crates/hive-workspace",
    "crates/hive-server",
    "crates/hive-eval",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.8"
futures-core = "0.3"
futures-util = "0.3"

